<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Invités & Tables</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- En-tête -->
        <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 bg-slate-800/60 p-6 rounded-2xl border border-slate-700/50 backdrop-blur-md">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">
                    Liste des Invités & Emplacements
                </h1>
                <p class="text-slate-400 text-sm mt-1">Consultez et organisez vos invités par carte ou par table.</p>
            </div>
            
            <!-- Statistiques rapides -->
            <div class="flex gap-3">
                <div class="bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700/40 text-center">
                    <span id="total-count" class="block text-xl font-bold text-indigo-400">0</span>
                    <span class="text-xs text-slate-400">Invités</span>
                </div>
                <div class="bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700/40 text-center">
                    <span id="tables-count" class="block text-xl font-bold text-pink-400">0</span>
                    <span class="text-xs text-slate-400">Tables</span>
                </div>
            </div>
        </header>

        <!-- Barre d'outils : Recherche + Bascule d'affichage -->
        <div class="flex flex-col sm:flex-row gap-3">
            <div class="relative flex-1">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Rechercher un invité ou une table..." 
                    class="w-full pl-12 pr-4 py-3 bg-slate-800/80 rounded-xl border border-slate-700 focus:outline-none focus:border-indigo-500 text-slate-200 placeholder-slate-400 transition"
                >
            </div>

            <!-- Commutateur de vue -->
            <div class="flex bg-slate-800/80 p-1.5 rounded-xl border border-slate-700 self-start sm:self-auto">
                <button id="view-grid-btn" onclick="setViewMode('grid')" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition bg-indigo-600 text-white">
                    <i data-lucide="layout-grid" class="w-4 h-4"></i>
                    <span>Individuel</span>
                </button>
                <button id="view-table-btn" onclick="setViewMode('grouped')" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 transition">
                    <i data-lucide="utensils" class="w-4 h-4"></i>
                    <span>Par Table</span>
                </button>
            </div>
        </div>

        <!-- Zone d'affichage des cartes -->
        <main id="guests-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Chargement en cours... -->
            <div class="col-span-full text-center py-12 text-slate-400">
                <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2 text-indigo-400"></i>
                <p>Chargement des données Supabase...</p>
            </div>
        </main>
        
    </div>

    <script>
        const SUPABASE_URL = 'https://ioswtwteahaumpgmingq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_faan40oD96N14XPBXfz0ow_wWfwdFoS';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allGuests = [];
        let currentViewMode = 'grid'; // 'grid' ou 'grouped'

        // Detection du type d'invité
        function getGuestType(name) {
            const clean = name.trim();
            if (/^Couple/i.test(clean)) {
                return { label: 'Couple', color: 'bg-purple-500/10 text-purple-400 border-purple-500/20', icon: 'users' };
            } else if (/^(Mme|Madame)/i.test(clean)) {
                return { label: 'Madame', color: 'bg-pink-500/10 text-pink-400 border-pink-500/20', icon: 'user-check' };
            } else {
                return { label: 'Monsieur', color: 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20', icon: 'user' };
            }
        }

        // Chargement Supabase
        async function fetchGuests() {
            try {
                const { data, error } = await supabaseClient
                    .from('guests')
                    .select('*')
                    .order('table_name', { ascending: true });

                if (error) throw error;

                allGuests = data || [];
                updateStats(allGuests);
                applyFilterAndRender();
            } catch (err) {
                console.error(err);
                document.getElementById('guests-grid').innerHTML = `
                    <div class="col-span-full bg-red-500/10 border border-red-500/30 text-red-400 p-4 rounded-xl text-center">
                        Erreur de connexion à Supabase : ${err.message}
                    </div>
                `;
            }
        }

        function updateStats(guests) {
            document.getElementById('total-count').textContent = guests.length;
            const uniqueTables = new Set(guests.map(g => g.table_name || 'Non assignée')).size;
            document.getElementById('tables-count').textContent = uniqueTables;
        }

        // Changement de mode d'affichage
        function setViewMode(mode) {
            currentViewMode = mode;
            const gridBtn = document.getElementById('view-grid-btn');
            const tableBtn = document.getElementById('view-table-btn');

            if (mode === 'grid') {
                gridBtn.className = "flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition bg-indigo-600 text-white";
                tableBtn.className = "flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 transition";
            } else {
                tableBtn.className = "flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition bg-indigo-600 text-white";
                gridBtn.className = "flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 transition";
            }

            applyFilterAndRender();
        }

        function applyFilterAndRender() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allGuests.filter(g => 
                g.name.toLowerCase().includes(query) || 
                (g.table_name && g.table_name.toLowerCase().includes(query))
            );

            if (currentViewMode === 'grid') {
                renderGridView(filtered);
            } else {
                renderGroupedView(filtered);
            }
        }

        // Vue 1 : Grille Individuelle
        function renderGridView(guests) {
            const grid = document.getElementById('guests-grid');
            grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4";

            if (guests.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">Aucun invité trouvé.</div>`;
                return;
            }

            grid.innerHTML = guests.map(guest => {
                const type = getGuestType(guest.name);
                return `
                    <div class="bg-slate-800/40 hover:bg-slate-800/80 border border-slate-700/60 p-5 rounded-2xl transition duration-200 hover:border-slate-500 flex flex-col justify-between space-y-4">
                        <div class="flex items-start justify-between gap-3">
                            <div>
                                <h3 class="font-semibold text-lg text-slate-100">${guest.name}</h3>
                                <p class="text-xs text-slate-400 mt-1 flex items-center gap-1">
                                    <i data-lucide="utensils" class="w-3.5 h-3.5 text-slate-500"></i>
                                    ${guest.table_name || 'Table non assignée'}
                                </p>
                            </div>
                            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium border ${type.color}">
                                <i data-lucide="${type.icon}" class="w-3 h-3"></i>
                                ${type.label}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        // Vue 2 : Groupé par Table
        function renderGroupedView(guests) {
            const grid = document.getElementById('guests-grid');
            grid.className = "grid grid-cols-1 md:grid-cols-2 gap-6";

            if (guests.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">Aucune table ou invité trouvé.</div>`;
                return;
            }

            // Regroupement par nom de table
            const grouped = guests.reduce((acc, guest) => {
                const tableName = guest.table_name || 'Sans Table / Non assigné(e)';
                if (!acc[tableName]) acc[tableName] = [];
                acc[tableName].push(guest);
                return acc;
            }, {});

            grid.innerHTML = Object.entries(grouped).map(([tableName, tableGuests]) => {
                return `
                    <div class="bg-slate-800/50 border border-slate-700/80 rounded-2xl p-5 space-y-4 shadow-lg backdrop-blur-sm">
                        <!-- En-tête de la Table -->
                        <div class="flex items-center justify-between pb-3 border-b border-slate-700/60">
                            <div class="flex items-center gap-2">
                                <div class="p-2 bg-indigo-500/10 border border-indigo-500/20 rounded-xl text-indigo-400">
                                    <i data-lucide="utensils" class="w-5 h-5"></i>
                                </div>
                                <h2 class="font-bold text-lg text-slate-100">${tableName}</h2>
                            </div>
                            <span class="bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-xs px-3 py-1 rounded-full font-semibold">
                                ${tableGuests.length} invité${tableGuests.length > 1 ? 's' : ''}
                            </span>
                        </div>

                        <!-- Liste des Invités de cette Table -->
                        <ul class="space-y-2.5">
                            ${tableGuests.map(guest => {
                                const type = getGuestType(guest.name);
                                return `
                                    <li class="flex items-center justify-between p-2.5 bg-slate-900/60 rounded-xl border border-slate-800 hover:border-slate-700 transition">
                                        <span class="text-sm text-slate-200 font-medium">${guest.name}</span>
                                        <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-medium border ${type.color}">
                                            <i data-lucide="${type.icon}" class="w-3 h-3"></i>
                                            ${type.label}
                                        </span>
                                    </li>
                                `;
                            }).join('')}
                        </ul>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        // Événement recherche
        document.getElementById('search-input').addEventListener('input', applyFilterAndRender);

        // Initialisation
        fetchGuests();
    </script>
</body>
</html>
